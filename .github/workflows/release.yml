name: release

# #1472: merging a release-preparation PR (branch `release/<issue>-vX.Y.Z`)
# publishes that version after one owner approval. It runs on the push to
# main or a maintenance line, so the `release` environment admits only those
# (#533). `prepare` only reads; the
# `publish` job runs in the `release` environment, whose required reviewer is
# the owner and whose RELEASE_TOKEN secret is the only credential that can
# open the PRs that run required CI. The Homebrew formula lives in this
# repository (#45), so there is no separate tap to write. Every step is
# re-runnable after a partial failure. Code that holds the credential always
# runs from the approved release commit, never from a newer main. See docs/release.en.md and
# docs/governance/release-policy.en.md.
# #1535: every release-preparation PR changes the manifest; a patch release that
# ships the in-tree placeholder version changes nothing else.
# #533: a patch can also come from a maintenance line `maint/X.Y`, cut from that
# minor's newest tag while main carries the next minor. The `release`
# environment admits `main` and `maint/*`; the owner's approval is unchanged.
# The line keeps its own record; main's manifest gains the row; only the newest
# release moves the formula, the installer pins, the site and "Latest".
on:
  push:
    branches: [main, 'maint/*']
    paths: [pyproject.toml, docs/release-manifest.json]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      release: ${{ steps.source.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      issue: ${{ steps.check.outputs.issue }}
      milestone_url: ${{ steps.check.outputs.milestone_url }}
      milestone_number: ${{ steps.check.outputs.milestone_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: source
        name: Find the PR this commit merged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_ref="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == env.GITHUB_REF_NAME)][0].head.ref // ""')"
          if [[ "$head_ref" == release/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          else
            echo "not a release-preparation merge (${head_ref:-no PR}); nothing to publish"
          fi

      - uses: actions/setup-python@v7
        if: steps.source.outputs.release == 'true'
        with:
          python-version: '3.12'

      - id: check
        if: steps.source.outputs.release == 'true'
        name: Check the version, its manifest entry and its milestone
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.source.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/dev/release.py check --branch "$GITHUB_REF_NAME")"
          issue="$(sed -nE 's#^release/([0-9]+)-v[0-9.]+$#\1#p' <<<"$HEAD_REF")"
          if [[ -z "$issue" || "$HEAD_REF" != "release/$issue-v$version" ]]; then
            echo "::error::branch $HEAD_REF must be release/<issue>-v$version"; exit 1
          fi
          # A re-run of every job after a partial failure finds its own tag (#313):
          # resume only when the tag names this exact release commit.
          tagged="$(git rev-parse -q --verify "refs/tags/v$version^{commit}" || true)"
          if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::tag v$version already exists at $tagged, not $GITHUB_SHA"; exit 1
          fi
          if [[ -n "$tagged" ]]; then
            echo "tag v$version already names $GITHUB_SHA; resuming"
          fi
          milestone="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"v$version\") | \"\(.open_issues) \(.number) \(.html_url)\"")"
          if [[ -z "$milestone" ]]; then
            echo "::error::milestone v$version does not exist"; exit 1
          fi
          read -r open_issues number url <<<"$milestone"
          if [[ "$open_issues" != 0 ]]; then
            echo "::error::milestone v$version still has $open_issues open issues"; exit 1
          fi
          {
            echo "version=$version"
            echo "issue=$issue"
            echo "milestone_url=$url"
            echo "milestone_number=$number"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
      checks: read
      # Only to dispatch deploy-pages with the job's own token after the pin (#313).
      actions: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ISSUE: ${{ needs.prepare.outputs.issue }}
      COMMIT: ${{ github.sha }}
      # main, or the maintenance line maint/X.Y this release was prepared on (#533).
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Require the release environment credential before any change
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set on the release environment; nothing was published"
            exit 1
          fi

      # The approved release commit, not a newer main: every helper that runs
      # while the credential is exposed comes from here. Changes to the latest
      # main are prepared in separate worktrees as data only.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned uv resolver
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.33'

      - name: Require the release commit's validate check to pass
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 55); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?check_name=validate" \
              --jq '.check_runs | if length == 0 then "" else (max_by(.started_at) | "\(.status):\(.conclusion)") end')"
            case "$result" in
              completed:success) echo "validate passed on $COMMIT"; exit 0 ;;
              completed:*) echo "::error::validate concluded ${result#completed:} on $COMMIT; nothing was published"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::validate did not finish on $COMMIT; nothing was published"
          exit 1

      # #533: a patch of an older minor, published after a newer minor, must not
      # move the formula, the installer pins, the site or GitHub's "Latest" badge.
      - id: newest
        name: Decide whether this release is the newest published one on main
        shell: bash
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/main"
          git fetch origin main
          git worktree add --detach "$tree" origin/main
          newest="$(python3 scripts/dev/release.py --root "$tree" newest --version "$VERSION")"
          git worktree remove --force "$tree"
          echo "v$VERSION is the newest published release on main: $newest"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

      - name: Tag the release commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_URL: ${{ needs.prepare.outputs.milestone_url }}
          NEWEST: ${{ steps.newest.outputs.newest }}
        run: |
          set -eu
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION already released; continuing"
          else
            python3 scripts/dev/release.py notes --version "$VERSION" --milestone-url "$MILESTONE_URL" \
              > "$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
              --title "Still v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
              --latest="$NEWEST"
          fi

      - id: archive
        name: Measure the served tag archive twice
        timeout-minutes: 10
        run: |
          set -eu
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$VERSION.tar.gz"
          curl -L --fail --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/a.tar.gz" "$url"
          sleep 30
          curl -L --fail --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/b.tar.gz" "$url"
          a="$(sha256sum "$RUNNER_TEMP/a.tar.gz" | cut -d' ' -f1)"
          b="$(sha256sum "$RUNNER_TEMP/b.tar.gz" | cut -d' ' -f1)"
          if [ "$a" != "$b" ]; then
            echo "::error::the served archive changed between measurements ($a, $b)"; exit 1
          fi
          echo "sha256=$a" >> "$GITHUB_OUTPUT"

      - id: formula
        name: Update the Homebrew formula and merge it after its install test passes
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          branch="build/$ISSUE-formula-v$VERSION"
          tree="$RUNNER_TEMP/formula"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json url --jq '.[0].url // ""')"
          if [[ -z "$pr" ]]; then
            git fetch origin main
            git worktree add -B "$branch" "$tree" origin/main
            # Refuses a formula whose body drifted from the reviewed template.
            python3 scripts/dev/release.py --root "$tree" formula --version "$VERSION" --sha256 "$SHA256"
            cd "$tree"
            git add Formula/agentos.rb
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "release: install Still v$VERSION with Homebrew (#$ISSUE)"
            git push --force -u origin "$branch"
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "release: install Still v$VERSION with Homebrew (#$ISSUE)" --body "$(cat <<EOF
          ## What changed

          Points \`Formula/agentos.rb\` at the v$VERSION tag archive (SHA-256 \`$SHA256\`, measured twice after publication), rendered from \`deploy/homebrew/agentos.rb.template\`. Opened by the release workflow after owner approval; it merges after the install-smoke Homebrew install and \`brew test\` pass.

          ## Existing solutions review (Adopt / Adapt / Build)

          - decision: N/A
          - N/A reason: release formula data written by scripts/dev/release.py; no component, dependency or framework is introduced.

          Refs #$ISSUE
          EOF
          )")"
          fi
          case "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" in
            MERGED) echo "$pr already merged" ;;
            OPEN)
              sleep 60
              gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 30
              gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch ;;
            *) echo "::error::$pr was closed without merging; reopen it or delete $branch and re-run"; exit 1 ;;
          esac
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - id: record
        name: Record the release in the manifest, installer and release-status prose of its branch
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          FORMULA_PR: ${{ steps.formula.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          branch="docs/$ISSUE-record-v$VERSION"
          tree="$RUNNER_TEMP/record"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json url --jq '.[0].url // ""')"
          if [[ -z "$pr" ]]; then
            git fetch origin "$BRANCH"
            git worktree add -B "$branch" "$tree" "origin/$BRANCH"
            tag_date="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json createdAt --jq '.createdAt[0:10]')"
            next="$(python3 scripts/dev/release.py --root "$tree" record --version "$VERSION" --commit "$COMMIT" \
              --sha256 "$SHA256" --date "$tag_date" --formula-pr "$FORMULA_PR")"
            cd "$tree"
            uv lock
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -am "release: record published v$VERSION and set $next as the next placeholder (#$ISSUE)"
            git push --force -u origin "$branch"
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BRANCH" --head "$branch" \
              --title "release: record published v$VERSION (#$ISSUE)" --body "$(cat <<EOF
          ## What changed

          Records the published v$VERSION on \`$BRANCH\`: manifest \`published\` entry with the served archive SHA-256 \`$SHA256\`, \`scripts/install.sh\` pins, release-status prose, and $next as the next in-tree placeholder. Homebrew formula: $FORMULA_PR. Opened by the release workflow after owner approval; it merges after its checks pass.

          ## Existing solutions review (Adopt / Adapt / Build)

          - decision: N/A
          - N/A reason: release bookkeeping data written by scripts/dev/release.py; no component, dependency or framework is introduced.

          Refs #$ISSUE
          EOF
          )")"
          fi
          # Merged here once its checks pass, like the formula: auto-merge needs
          # branch protection on main, which this repository does not set (#79).
          case "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" in
            MERGED) echo "$pr already merged" ;;
            OPEN)
              sleep 60
              gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 30
              gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch ;;
            *) echo "::error::$pr was closed without merging"; exit 1 ;;
          esac
          merged="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')"
          if [[ -z "$merged" ]]; then echo "::error::$pr did not merge"; exit 1; fi
          echo "commit=$merged" >> "$GITHUB_OUTPUT"

      # #533: main's manifest lists every published release. A release from a
      # maintenance line adds its row to main here; main's in-tree version moves
      # past it only if it does not already, and the installer and status prose
      # move only when it is the newest release.
      - id: register
        name: Register a maintenance-line release on main
        if: env.BRANCH != 'main'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          FORMULA_PR: ${{ steps.formula.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          branch="docs/$ISSUE-register-v$VERSION"
          tree="$RUNNER_TEMP/register"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json url --jq '.[0].url // ""')"
          if [[ -z "$pr" ]]; then
            git fetch origin main
            git worktree add -B "$branch" "$tree" origin/main
            tag_date="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json createdAt --jq '.createdAt[0:10]')"
            in_tree="$(python3 scripts/dev/release.py --root "$tree" register --source "$GITHUB_WORKSPACE" \
              --version "$VERSION" --commit "$COMMIT" --sha256 "$SHA256" --date "$tag_date" --formula-pr "$FORMULA_PR")"
            cd "$tree"
            uv lock
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -am "release: register v$VERSION from $BRANCH on main (#$ISSUE)"
            git push --force -u origin "$branch"
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "release: register v$VERSION from $BRANCH (#$ISSUE)" --body "$(cat <<EOF
          ## What changed

          Adds the published v$VERSION, released from \`$BRANCH\`, to the manifest on main (served archive SHA-256 \`$SHA256\`). Main's in-tree version is $in_tree. The installer pins and release-status prose move only when v$VERSION is the newest published release. Opened by the release workflow after owner approval; it merges after its checks pass.

          ## Existing solutions review (Adopt / Adapt / Build)

          - decision: N/A
          - N/A reason: release bookkeeping data written by scripts/dev/release.py; no component, dependency or framework is introduced.

          Refs #$ISSUE
          EOF
          )")"
          fi
          case "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" in
            MERGED) echo "$pr already merged" ;;
            OPEN)
              sleep 60
              gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 30
              gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch ;;
            *) echo "::error::$pr was closed without merging"; exit 1 ;;
          esac
          merged="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')"
          if [[ -z "$merged" ]]; then echo "::error::$pr did not merge"; exit 1; fi
          echo "commit=$merged" >> "$GITHUB_OUTPUT"

      # The commit on main whose scripts/install.sh installs this release.
      - name: Pin the README installer to the commit that installs this release
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RECORDED: ${{ steps.register.outputs.commit || steps.record.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          branch="docs/$ISSUE-pin-installer-v$VERSION"
          tree="$RUNNER_TEMP/pin"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json url --jq '.[0].url // ""')"
          if [[ -z "$pr" ]]; then
            git fetch origin main
            git worktree add -B "$branch" "$tree" origin/main
            python3 scripts/dev/release.py --root "$tree" pin --commit "$RECORDED"
            cd "$tree"
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -am "docs: pin the one-line installer to the commit that installs v$VERSION (#$ISSUE)"
            git push --force -u origin "$branch"
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "docs: pin the one-line installer to the commit that installs v$VERSION (#$ISSUE)" --body "$(cat <<EOF
          ## What changed

          Points the README one-line installer, in all four locales, at $RECORDED, whose \`scripts/install.sh\` installs v$VERSION. Opened by the release workflow; it merges after its checks pass. The site picks this up on its next deploy-pages run.

          ## Existing solutions review (Adopt / Adapt / Build)

          - decision: N/A
          - N/A reason: README pin update written by scripts/dev/release.py; no component, dependency or framework is introduced.

          Refs #$ISSUE
          EOF
          )")"
          fi
          case "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" in
            MERGED) echo "$pr already merged" ;;
            OPEN)
              sleep 60
              gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 30
              gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch ;;
            *) echo "::error::$pr was closed without merging; the README still pins the previous release"; exit 1 ;;
          esac

      # The owner's approval of this release is the site's promotion decision
      # too (#313): deploy-pages stamps the new pin and version from main. The
      # job's own token can dispatch a workflow; RELEASE_TOKEN is not used.
      - name: Deploy the site with the new release
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  # The milestone is the release's scope; it closes only after every publish
  # step above succeeded (#335). A job of its own, so `issues: write` is held
  # by the job token here and not by the release environment or RELEASE_TOKEN.
  close-milestone:
    needs: [prepare, publish]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the release milestone
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MILESTONE: ${{ needs.prepare.outputs.milestone_number }}
        shell: bash
        run: |
          set -euo pipefail
          milestone="repos/$GITHUB_REPOSITORY/milestones/$MILESTONE"
          read -r title state open_issues <<<"$(gh api "$milestone" --jq '"\(.title) \(.state) \(.open_issues)"')"
          if [[ "$title" != "v$VERSION" ]]; then
            echo "::error::milestone $MILESTONE is $title, not v$VERSION"; exit 1
          fi
          if [[ "$state" == closed ]]; then
            echo "milestone v$VERSION already closed"; exit 0
          fi
          if [[ "$open_issues" != 0 ]]; then
            echo "::error::milestone v$VERSION gained $open_issues open issues during the release; move them and re-run"; exit 1
          fi
          gh api -X PATCH "$milestone" -f state=closed --jq '"closed \(.html_url)"'
