name: full-validate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  full-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads
      - run: .venv/bin/python scripts/verify_master_plan_docs.py
      - run: .venv/bin/python scripts/verify_readme_localization.py --check-git-diff
      - run: .venv/bin/python scripts/verify_src_layout.py
      - run: .venv/bin/python -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('docs/issue-branch-ledger.jsonl').read_text(encoding='utf-8').splitlines()]"
      - run: .venv/bin/python scripts/verify_agentpackage_v01.py
      # #135: one worker per core; --dist loadfile keeps each file on one worker.
      - run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -n auto --dist loadfile --durations=40 tests

  # MACOS-CI-01 #1178: the same suite on macOS, where the embedded system
  # WebKit browser, Keychain-backed sessions and launchd paths actually run.
  # AGENTOS_REAL_BROWSER_TESTS keeps real windows off an owner's screen during
  # local runs; a CI runner has no owner screen, so they run here.
  full-validate-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AGENTOS_REAL_BROWSER_TESTS: '1'
      # Every file that reads AGENTOS_REAL_BROWSER_TESTS
      # (tests/test_governance_contract.py keeps this list complete).
      REAL_BROWSER_FILES: >-
        tests/test_browser_limits.py
        tests/test_browser_timeout_recovery.py
        tests/test_browser_webkit.py
        tests/test_cli_route_agency.py
        tests/test_flow_login.py
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads
      # #135: everything except the real-WebKit files runs in parallel; those
      # files open real browser windows, so they run serially afterwards.
      - name: Suite without real-WebKit files (parallel)
        run: |
          ignores=""
          for f in $REAL_BROWSER_FILES; do ignores="$ignores --ignore=$f"; done
          PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -n auto --dist loadfile --durations=40 $ignores tests
      - name: Real-WebKit files (serial)
        if: ${{ !cancelled() }}
        run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q --durations=0 $REAL_BROWSER_FILES
