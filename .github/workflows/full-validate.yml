name: full-validate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  full-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads
      - run: .venv/bin/python scripts/verify_master_plan_docs.py
      - run: .venv/bin/python scripts/verify_readme_localization.py --check-git-diff
      - run: .venv/bin/python scripts/verify_src_layout.py
      - run: .venv/bin/python -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('docs/issue-branch-ledger.jsonl').read_text(encoding='utf-8').splitlines()]"
      - run: .venv/bin/python scripts/verify_agentpackage_v01.py
      # #135: one worker per core; --dist loadfile keeps each file on one worker.  #156: on
      # one runner, --dist worksteal measured no faster (the workers already finish together),
      # so loadfile stays.  --durations lists the slowest tests for the next look.
      - run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -n auto --dist loadfile --durations=25 tests

  # #34: the real-engine browser classes against the Linux desktop's Chromium worker: the pinned
  # Chrome for Testing build Still itself downloads and checks, under a virtual display, with its
  # sandbox on.  Where Ubuntu restricts user namespaces, the runner installs the AppArmor profile
  # with the same command Still shows an owner.
  full-validate-linux-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra linux-browser --extra schema-validation --group dev --no-python-downloads
      - name: Chromium's system libraries and a virtual display
        run: sudo "$PWD/.venv/bin/playwright" install-deps chromium && sudo apt-get install -y -qq xvfb xauth
      - name: The pinned Chromium, and its sandbox profile where user namespaces are restricted
        run: |
          tools="$RUNNER_TEMP/still-tools"
          echo "AGENTOS_TEST_TOOLS_DIR=$tools" >> "$GITHUB_ENV"
          runtime() { PYTHONPATH=src .venv/bin/python -c "import sys; from personal_agent import chromium_runtime as c; $1" "$tools"; }
          chrome=$(runtime 'print(c.ensure(sys.argv[1]))')
          if runtime 'sys.exit(0 if c.userns_restricted() else 1)'; then
            sh -c "$(PYTHONPATH=src .venv/bin/python -c "import sys; from personal_agent import chromium_runtime as c; print(c.apparmor_setup(sys.argv[1]))" "$chrome")"
          fi
      - name: Real-engine browser classes against Chromium (serial)
        env:
          AGENTOS_REAL_BROWSER_TESTS: '1'
        run: PATH="$PWD/.venv/bin:$PATH" xvfb-run -a python3 -m pytest -q --durations=25 tests/test_browser_webkit.py::WebKitIntegrationTests

  # MACOS-CI-01 #1178: the same suite on macOS, where the embedded system
  # WebKit browser, Keychain-backed sessions and launchd paths actually run.
  # AGENTOS_REAL_BROWSER_TESTS keeps real windows off an owner's screen during
  # local runs; a CI runner has no owner screen, so they run here.
  full-validate-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # #156: every test class gated on AGENTOS_REAL_BROWSER_TESTS
      # (tests/test_governance_contract.py keeps this list complete).
      REAL_BROWSER_TESTS: >-
        tests/test_browser_timeout_recovery.py::RealWebKitRecoveryTests
        tests/test_browser_webkit.py::KeychainIntegrationTests
        tests/test_browser_webkit.py::WebKitIntegrationTests
        tests/test_cli_route_agency.py::RealWorkerThroughTheBridge
        tests/test_flow_login.py::RealWorkerRenderSettle
        tests/test_flow_login.py::RealWorkerInFlowLogin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads
      # #135, #156: the whole suite in parallel.  AGENTOS_REAL_BROWSER_TESTS is not set
      # here, so the real-WebKit classes skip; the rest of their files runs with the suite.
      - name: Suite (parallel; real-WebKit classes skip)
        run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -n auto --dist loadfile --durations=25 tests
      # Those classes open real browser windows, so they run one at a time afterwards.
      - name: Real-WebKit classes (serial)
        if: ${{ !cancelled() }}
        env:
          AGENTOS_REAL_BROWSER_TESTS: '1'
        run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q --durations=25 $REAL_BROWSER_TESTS
