name: full-validate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  full-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads
      - run: .venv/bin/python scripts/verify_master_plan_docs.py
      - run: .venv/bin/python scripts/verify_readme_localization.py --check-git-diff
      - run: .venv/bin/python scripts/verify_src_layout.py
      - run: .venv/bin/python -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('docs/issue-branch-ledger.jsonl').read_text(encoding='utf-8').splitlines()]"
      - run: .venv/bin/python scripts/verify_agentpackage_v01.py
      # #135: one worker per core.  #156: --dist worksteal hands out single tests and an
      # idle worker takes queued ones from a busy one, so a large file no longer keeps one
      # worker running alone at the end.  --durations lists the slowest tests.
      # #156 measurement only (reverted before merge): the same suite, same runner, each distribution in turn.
      - name: Measure distributions
        if: ${{ !cancelled() }}
        run: |
          for dist in loadfile worksteal loadfile worksteal; do
            start=$(date +%s)
            PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -p no:cacheprovider -n auto --dist $dist --junitxml=junit-$dist.xml tests > out-$dist.txt 2>&1 || true
            echo "MEASURE $dist wall=$(( $(date +%s) - start ))s $(tail -1 out-$dist.txt)"
            PATH="$PWD/.venv/bin:$PATH" python3 - "junit-$dist.xml" <<'PY'
          import collections, sys, xml.etree.ElementTree as ET
          files = collections.Counter()
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              parts = case.get('classname', '').split('.')
              files[next((part for part in parts if part.startswith('test_')), parts[0])] += float(case.get('time') or 0)
          print('MEASURE top files:', ', '.join(f'{name} {seconds:.0f}s' for name, seconds in files.most_common(8)),
                f'| sum {sum(files.values()):.0f}s')
          PY
          done

  # MACOS-CI-01 #1178: the same suite on macOS, where the embedded system
  # WebKit browser, Keychain-backed sessions and launchd paths actually run.
  # AGENTOS_REAL_BROWSER_TESTS keeps real windows off an owner's screen during
  # local runs; a CI runner has no owner screen, so they run here.
  full-validate-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # #156: every test class gated on AGENTOS_REAL_BROWSER_TESTS
      # (tests/test_governance_contract.py keeps this list complete).
      REAL_BROWSER_TESTS: >-
        tests/test_browser_timeout_recovery.py::RealWebKitRecoveryTests
        tests/test_browser_webkit.py::KeychainIntegrationTests
        tests/test_browser_webkit.py::WebKitIntegrationTests
        tests/test_cli_route_agency.py::RealWorkerThroughTheBridge
        tests/test_flow_login.py::RealWorkerRenderSettle
        tests/test_flow_login.py::RealWorkerInFlowLogin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads
      # #156 measurement only (reverted before merge): where the real-WebKit classes spend wall time.
      - name: Profile real-WebKit classes (serial)
        if: ${{ !cancelled() }}
        env:
          AGENTOS_REAL_BROWSER_TESTS: '1'
        run: |
          PATH="$PWD/.venv/bin:$PATH" python3 -m cProfile -o real.prof -m pytest -q --durations=40 $REAL_BROWSER_TESTS || true
          PATH="$PWD/.venv/bin:$PATH" python3 - <<'PY'
          import pstats
          stats = pstats.Stats('real.prof')
          stats.sort_stats('cumulative')
          stats.print_stats(r'personal_agent|tests/', 60)
          stats.sort_stats('tottime')
          stats.print_stats(25)
          PY
      # #156 measurement only (reverted before merge): the same suite, same runner, each distribution in turn.
      - name: Measure distributions
        if: ${{ !cancelled() }}
        run: |
          for dist in loadfile worksteal; do
            start=$(date +%s)
            PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -p no:cacheprovider -n auto --dist $dist --junitxml=junit-$dist.xml tests > out-$dist.txt 2>&1 || true
            echo "MEASURE $dist wall=$(( $(date +%s) - start ))s $(tail -1 out-$dist.txt)"
            PATH="$PWD/.venv/bin:$PATH" python3 - "junit-$dist.xml" <<'PY'
          import collections, sys, xml.etree.ElementTree as ET
          files = collections.Counter()
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              parts = case.get('classname', '').split('.')
              files[next((part for part in parts if part.startswith('test_')), parts[0])] += float(case.get('time') or 0)
          print('MEASURE top files:', ', '.join(f'{name} {seconds:.0f}s' for name, seconds in files.most_common(8)),
                f'| sum {sum(files.values()):.0f}s')
          PY
          done
