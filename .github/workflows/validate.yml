name: validate

on:
  pull_request:
    branches: [main, 'maint/*']
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main, 'maint/*']

permissions:
  contents: read

# A pull request cancels its own superseded runs. Every commit pushed to main or
# to a maintenance line maint/X.Y (#533) keeps its own run: the release workflow
# requires validate to pass on the exact release commit, and a later merge must
# not cancel it (#292).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify assistant execution specification and ownership
        run: python3 scripts/verify_assistant_execution.py --check-spec

      - name: Verify canonical documents and plan integrity
        run: python3 scripts/verify_master_plan_docs.py

      - name: Verify PR reuse review
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_validator="$RUNNER_TEMP/verify_reuse_review.py"
          if git cat-file -e "$BASE_SHA:scripts/verify_reuse_review.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/verify_reuse_review.py" > "$trusted_validator"
          else
            # Bootstrap this gate on the PR that first introduces it. Future
            # PRs use the protected base revision above.
            cp scripts/verify_reuse_review.py "$trusted_validator"
          fi
          python3 "$trusted_validator"

      - name: Verify public README parity
        run: python3 scripts/verify_readme_localization.py --check-git-diff

      - name: Verify src layout
        run: python3 scripts/verify_src_layout.py

      - name: Verify ledger JSON
        run: python3 -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('docs/issue-branch-ledger.jsonl').read_text(encoding='utf-8').splitlines()]"

      - name: Install pinned uv resolver
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.33'
          enable-cache: true

      - name: Sync locked validation dependencies
        run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads

      - name: Verify every platform installs from wheels
        run: sh scripts/dev/verify_wheels.sh

      # These checks do not use service fixtures; classification coverage is local and model-free.
      - name: Run focused governance and README tests
        run: |
          PATH="$PWD/.venv/bin:$PATH" python3 -m pytest --noconftest -q \
            tests/test_readme_localization.py \
            tests/test_reuse_review_gate.py \
            tests/test_pr_preflight.py \
            tests/test_governance_contract.py \
            tests/test_verify_src_layout.py \
            tests/test_release_script.py

      # #260: a pull request whose every changed path is repository text runs the tests that read
      # text, and one that only swaps release identifiers runs the release tests (#508); anything
      # else, and every push to main, runs the whole suite. The scope script comes
      # from the protected base revision, so a pull request cannot loosen its own scope.
      - name: Decide test scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "suite=full" >> "$GITHUB_OUTPUT"; exit 0; fi
          trusted_scope="$RUNNER_TEMP/test_scope.py"
          if git cat-file -e "$BASE_SHA:scripts/ci/test_scope.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/test_scope.py" > "$trusted_scope"
          else
            # Bootstrap on the PR that introduces the script; later PRs use the base revision.
            cp scripts/ci/test_scope.py "$trusted_scope"
          fi
          python3 "$trusted_scope" --base "$BASE_SHA" --head "$HEAD_SHA" --root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_OUTPUT"

      # #234: the whole test suite, with full-validate's Linux invocation (#135). The real-WebKit
      # classes skip on Linux; they run in the nightly/dispatched full-validate on macOS.
      - name: Run the full test suite (parallel)
        if: steps.scope.outputs.suite != 'text' && steps.scope.outputs.suite != 'release'
        run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -n auto --dist loadfile --durations=25 tests

      # #508: a release-data pull request (only versions, dates and digests swapped) runs the release tests.
      - name: Run the tests the scope selected (parallel)
        if: steps.scope.outputs.suite == 'text' || steps.scope.outputs.suite == 'release'
        env:
          TEXT_TESTS: ${{ steps.scope.outputs.tests }}
        run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q -n auto --dist loadfile --durations=25 $TEXT_TESTS
