<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" xml:lang="ko">
<title>대화는 이어지고,</title><desc>로그인한 뒤  장바구니를 직접 확인했는데, CJ 스팸 클래식 200g 한 개가 들어 있어요. 빼지 않으셨고 그대로 담긴 상태예요. 일부 단계는 확인하지 못했어요. 실제 대화를 번역·축약해 재구성한 이미지</desc>
<rect width="1000" height="1040" rx="32" fill="#f0f1f3"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="50" y="65" font-size="28" fill="#626262">Still / 02</text>
<text x="50" y="145" font-size="58" font-weight="550" fill="#171717">대화는 이어지고,</text>
<text x="50" y="210" font-size="32" fill="#626262">로그인한 뒤</text>
<rect x="50" y="265" width="880" height="278" rx="28" fill="#ffffff"/><text x="80" y="300" font-size="24" fill="#171717">Still</text><text x="80" y="350" font-size="36" fill="#171717">장바구니를 직접 확인했는데, CJ 스팸 클래식</text><text x="80" y="402" font-size="36" fill="#171717">200g 한 개가 들어 있어요. 빼지 않으셨고</text><text x="80" y="454" font-size="36" fill="#171717">그대로 담긴 상태예요. 일부 단계는 확인하지</text><text x="80" y="506" font-size="36" fill="#171717">못했어요.</text>
<path d="M50 950H950" stroke="#d5d5d5"/>
<text x="50" y="990" font-size="27" fill="#626262">실제 대화를 번역·축약해 재구성한 이미지</text>
</g></svg>
