<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" xml:lang="ko">
<title>찾던 F1 모형을 아마존에서도 조사합니다</title><desc>찾던 F1 모형을 아마존에서도 조사합니다 F1 모형 자동차에 관심이 있어. 어디서 주문할 수 있을까? 이어서 같은 모형을 더 찾아봅니다 아마존에서도 더 찾아봐 줄래? 네. 한국 배송이 표시된 Amazon US 상품을 더 찾았어요. 모두 Bburago 1:43 모형이에요. … 첫 모형으로는 McLaren MCL38을 추천해요. 최종 금액은 결제 단계에서 확인해야 합니다. 일부 단계는 확인하지 못했어요. 실제 대화 · 번역·축약 2026-10-11</desc>
<rect width="1000" height="1280" rx="32" fill="#f0f1f3"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="60" y="44" font-size="26" font-weight="550" fill="#171717">Still</text>
<text x="940" y="44" text-anchor="end" font-size="22" fill="#626262">2026-10-11 · Telegram</text>
<path d="M60 68H940" stroke="#d5d5d5"/>
<text x="60" y="120" font-size="40" fill="#171717">찾던 F1 모형을 아마존에서도 조사합니다</text>
<g transform="translate(0 40)"><g class="bubble" data-role="user"><rect x="247.60000000000002" y="160" width="702.4" height="160" rx="28" fill="#e5e7e9"/><text x="279.6" y="222" font-size="42" fill="#171717">F1 모형 자동차에 관심이 있어.</text><text x="279.6" y="282" font-size="42" fill="#171717">어디서 주문할 수 있을까?</text></g><text x="65" y="374" font-size="38" fill="#626262">이어서 같은 모형을 더 찾아봅니다</text><g class="bubble" data-role="user"><rect x="281.19999999999993" y="411" width="668.8000000000001" height="100" rx="28" fill="#e5e7e9"/><text x="313.19999999999993" y="473" font-size="42" fill="#171717">아마존에서도 더 찾아봐 줄래?</text></g><g class="bubble" data-role="assistant"><rect x="50" y="527" width="900" height="280" rx="28" fill="#ffffff"/><text x="82" y="589" font-size="42" fill="#171717">네. 한국 배송이 표시된 Amazon US</text><text x="82" y="649" font-size="42" fill="#171717">상품을 더 찾았어요. 모두 Bburago 1:43</text><text x="82" y="709" font-size="42" fill="#171717">모형이에요. … 첫 모형으로는 McLaren</text><text x="82" y="769" font-size="42" fill="#171717">MCL38을 추천해요.</text></g><text x="65" y="861" font-size="38" fill="#626262">최종 금액은 결제 단계에서 확인해야 합니다.</text><text x="65" y="916" font-size="38" fill="#626262">일부 단계는 확인하지 못했어요.</text></g>
<text x="60" y="1245" font-size="30" fill="#626262">실제 대화 · 번역·축약</text>
