<title>일하는 AI를 바꿔도,</title><desc>앞선 맥락 · 요약 라떼용 원두를 고르는 대화입니다. 장바구니에는 쟈뎅이 있고, 모모스커피 에스쇼콜라 500g도 라떼용으로 추천받았습니다. Codex → Claude Code /ai claude-code 기본 AI를 Claude Code로 바꿨어요. 다음 요청부터 적용됩니다. 실제 대화를 번역·축약해 재구성한 이미지 2026-10-12</desc>
