<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" xml:lang="ko">
<title>찾던 F1 모형을 아마존에서도 조사합니다</title><desc>찾던 F1 모형을 아마존에서도 조사합니다 F1 모형 자동차에 관심이 있어. 어디서 주문할 수 있을까? 이어서 같은 모형을 더 찾아봅니다 아마존에서도 더 찾아봐 줄래? 네. 한국 배송이 표시된 Amazon US 상품을 더 찾았어요. 모두 Bburago 1:43 모형이에요. … 첫 모형으로는 McLaren MCL38을 추천해요. 최종 금액은 결제 단계에서 확인해야 합니다. 일부 단계는 확인하지 못했어요. 실제 대화 · 번역·축약 2026-10-11</desc>
<rect width="1000" height="1400" rx="32" fill="#f0f1f3"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="60" y="65" font-size="28" font-weight="550" fill="#171717">Still</text>
<text x="940" y="65" text-anchor="end" font-size="24" fill="#626262">2026-10-11 · Telegram</text>
<path d="M60 100H940" stroke="#d5d5d5"/>
<text x="60" y="160" font-size="42" fill="#171717">찾던 F1 모형을 아마존에서도 조사합니다</text>
<g transform="translate(0 44.5)"><rect x="180" y="213" width="770" height="264" rx="28" fill="#e5e7e9"/><text x="212" y="243" font-size="24" fill="#626262">나</text><text x="212" y="278" font-size="47" fill="#171717">F1 모형 자동차에 관심이</text><text x="212" y="346" font-size="47" fill="#171717">있어. 어디서 주문할 수</text><text x="212" y="414" font-size="47" fill="#171717">있을까?</text><text x="65" y="536" font-size="43" fill="#626262">이어서 같은 모형을 더 찾아봅니다</text><rect x="180" y="575" width="770" height="128" rx="28" fill="#e5e7e9"/><text x="212" y="605" font-size="24" fill="#626262">나</text><text x="212" y="640" font-size="47" fill="#171717">아마존에서도 더 찾아봐 줄래?</text><rect x="50" y="719" width="900" height="332" rx="28" fill="#ffffff"/><text x="82" y="749" font-size="24" fill="#626262">Still</text><text x="82" y="784" font-size="47" fill="#171717">네. 한국 배송이 표시된 Amazon US</text><text x="82" y="852" font-size="47" fill="#171717">상품을 더 찾았어요. 모두 Bburago</text><text x="82" y="920" font-size="47" fill="#171717">1:43 모형이에요. … 첫 모형으로는</text><text x="82" y="988" font-size="47" fill="#171717">McLaren MCL38을 추천해요.</text><text x="65" y="1110" font-size="43" fill="#626262">최종 금액은 결제 단계에서 확인해야</text><text x="65" y="1172" font-size="43" fill="#626262">합니다. 일부 단계는 확인하지 못했어요.</text></g>
<text x="60" y="1365" font-size="30" fill="#626262">실제 대화 · 번역·축약</text>
</g></svg>
