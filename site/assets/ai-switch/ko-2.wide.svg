<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" xml:lang="ko">
<title>대화는 이어지고,</title><desc>로그인한 뒤  장바구니를 직접 확인했는데, CJ 스팸 클래식 200g 한 개가 들어 있어요. 빼지 않으셨고 그대로 담긴 상태예요. 일부 단계는 확인하지 못했어요. 실제 대화를 번역·축약해 재구성한 이미지</desc>
<rect width="1440" height="900" rx="40" fill="#f0f1f3"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="70" y="85" font-size="26" fill="#626262">Still / 02</text>
<text x="70" y="300" font-size="50" fill="#171717">대화는 이어지고,</text>
<text x="70" y="530" font-size="28" fill="#626262">로그인한 뒤</text>
<text x="70" y="760" font-size="23" fill="#626262">실제 대화를 번역·축약해</text><text x="70" y="794" font-size="23" fill="#626262">재구성한 이미지</text>
<rect x="520" y="135" width="850" height="254" rx="26" fill="#ffffff"/><text x="550" y="169" font-size="23" fill="#626262">Still</text><text x="550" y="217" font-size="32" fill="#171717">장바구니를 직접 확인했는데, CJ 스팸 클래식</text><text x="550" y="263" font-size="32" fill="#171717">200g 한 개가 들어 있어요. 빼지 않으셨고</text><text x="550" y="309" font-size="32" fill="#171717">그대로 담긴 상태예요. 일부 단계는 확인하지</text><text x="550" y="355" font-size="32" fill="#171717">못했어요.</text>
</g></svg>
