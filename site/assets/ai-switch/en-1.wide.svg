<rect x="570" y="135" width="800" height="162" rx="26" fill="#e5e7e9"/><text x="600" y="169" font-size="23" fill="#626262">You</text><text x="600" y="217" font-size="32" fill="#171717">Did we end up adding the Spam yesterday,</text><text x="600" y="263" font-size="32" fill="#171717">or taking it out?</text><rect x="520" y="323" width="850" height="300" rx="26" fill="#ffffff"/><text x="550" y="357" font-size="23" fill="#626262">Still</text><text x="550" y="405" font-size="32" fill="#171717">From the conversation, I last said I had</text><text x="550" y="451" font-size="32" fill="#171717">put one Spam Classic 200 g back in the</text><text x="550" y="497" font-size="32" fill="#171717">cart. I cannot establish whether that was</text><text x="550" y="543" font-size="32" fill="#171717">yesterday. Sign in so I can check the</text><text x="550" y="589" font-size="32" fill="#171717">current cart.</text>
