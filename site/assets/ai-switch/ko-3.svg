<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" xml:lang="ko">
<title>다른 AI로 계속합니다.</title><desc>Codex로 바꾼 뒤 스팸 빼줘 스팸 클래식 200g 한 개를 장바구니에서 뺐어요. 다시 확인했고, 나머지 22개 상품은 그대로 있어요. 지금은 판단 AI를 사용할 수 없어 기본 AI가 요청을 바로 처리합니다. 실제 대화를 번역·축약해 재구성한 이미지</desc>
<rect width="1000" height="1040" rx="32" fill="#f3eee9"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="50" y="65" font-size="28" fill="#53655c">Still / 03</text>
<text x="50" y="145" font-size="58" font-weight="650" fill="#293c35">다른 AI로 계속합니다.</text>
<text x="50" y="210" font-size="32" fill="#53655c">Codex로 바꾼 뒤</text>
<rect x="90" y="265" width="840" height="122" rx="28" fill="#e6d8ce"/><text x="120" y="300" font-size="24" fill="#293c35">나</text><text x="120" y="350" font-size="36" fill="#293c35">스팸 빼줘</text><rect x="50" y="417" width="880" height="278" rx="28" fill="#fffdfa"/><text x="80" y="452" font-size="24" fill="#293c35">Still</text><text x="80" y="502" font-size="36" fill="#293c35">스팸 클래식 200g 한 개를 장바구니에서 뺐어</text><text x="80" y="554" font-size="36" fill="#293c35">요. 다시 확인했고, 나머지 22개 상품은 그대</text><text x="80" y="606" font-size="36" fill="#293c35">로 있어요. 지금은 판단 AI를 사용할 수 없어</text><text x="80" y="658" font-size="36" fill="#293c35"> 기본 AI가 요청을 바로 처리합니다.</text>
<path d="M50 950H950" stroke="#bdc9bd"/>
<text x="50" y="990" font-size="27" fill="#53655c">실제 대화를 번역·축약해 재구성한 이미지</text>
