<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" xml:lang="ko">
<title>앞선 추천을 다른 AI와 이어갑니다</title><desc>앞선 추천을 다른 AI와 이어갑니다 라떼로 마실 원두 추천해 줘. 고소하고 단맛 나는 게 좋아. 자뎅 에스프레소 블렌드와 모모스 에스쇼콜라를 추천해요. /ai claude-code Codex → Claude Code 그럼 이번엔 두 번째 걸로 해볼래. 모모스 에스쇼콜라로 볼게요. 라떼에 넣었을 때도 고소하고 달콤한 맛이 나는지 이어서 확인해 볼게요. 사용 흐름 예시 · 실제 대화 원문 아님 설명용 예시 대화</desc>
<rect width="1000" height="1280" rx="32" fill="#f0f1f3"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="60" y="44" font-size="26" font-weight="550" fill="#171717">Still</text>
<text x="940" y="44" text-anchor="end" font-size="22" fill="#626262">설명용 예시 대화</text>
<path d="M60 68H940" stroke="#d5d5d5"/>
<text x="60" y="120" font-size="40" fill="#171717">앞선 추천을 다른 AI와 이어갑니다</text>
<g transform="translate(0 40)"><g class="bubble" data-role="user"><rect x="298.0" y="160" width="652.0" height="160" rx="28" fill="#e5e7e9"/><text x="330.0" y="222" font-size="42" fill="#171717">라떼로 마실 원두 추천해 줘.</text><text x="330.0" y="282" font-size="42" fill="#171717">고소하고 단맛 나는 게 좋아.</text></g><text x="58" y="356" font-size="24" fill="#626262">Still · Codex</text><g class="bubble" data-role="assistant"><rect x="50" y="370" width="727.5999999999999" height="160" rx="28" fill="#ffffff"/><text x="82" y="432" font-size="42" fill="#171717">자뎅 에스프레소 블렌드와 모모스</text><text x="82" y="492" font-size="42" fill="#171717">에스쇼콜라를 추천해요.</text></g><path d="M50 582H950" stroke="#c7cbd0"/><rect x="275.0" y="546" width="450" height="72" rx="22" fill="#e1e4e8"/><text x="500.0" y="576" text-anchor="middle" font-size="28" fill="#171717">Codex → Claude Code</text><text x="500.0" y="602" text-anchor="middle" font-size="22" fill="#626262">/ai claude-code</text><g class="bubble" data-role="user"><rect x="365.19999999999993" y="638" width="584.8000000000001" height="160" rx="28" fill="#e5e7e9"/><text x="397.19999999999993" y="700" font-size="42" fill="#171717">그럼 이번엔 두 번째 걸로</text><text x="397.19999999999993" y="760" font-size="42" fill="#171717">해볼래.</text></g><text x="58" y="834" font-size="24" fill="#626262">Still · Claude Code</text><g class="bubble" data-role="assistant"><rect x="50" y="848" width="794.8" height="220" rx="28" fill="#ffffff"/><text x="82" y="910" font-size="42" fill="#171717">모모스 에스쇼콜라로 볼게요. 라떼에</text><text x="82" y="970" font-size="42" fill="#171717">넣었을 때도 고소하고 달콤한 맛이</text><text x="82" y="1030" font-size="42" fill="#171717">나는지 이어서 확인해 볼게요.</text></g></g>
<text x="60" y="1245" font-size="30" fill="#626262">사용 흐름 예시 · 실제 대화 원문 아님</text>
</g></svg>
