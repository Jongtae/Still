<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" xml:lang="ko">
<title>앞선 추천을 다른 AI와 이어갑니다</title><desc>앞선 추천을 다른 AI와 이어갑니다 라떼로 마실 원두 추천해 줘. 고소하고 단맛 나는 게 좋아. 자뎅 에스프레소 블렌드와 모모스 에스쇼콜라를 추천해요. /ai claude-code Codex → Claude Code 그럼 이번엔 두 번째 걸로 해볼래. 모모스 에스쇼콜라로 볼게요. 라떼에 넣었을 때도 고소하고 달콤한 맛이 나는지 이어서 확인해 볼게요. 사용 흐름 예시 · 실제 대화 원문 아님 설명용 예시 대화</desc>
<rect width="1440" height="940" rx="32" fill="#f0f1f3"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="60" y="44" font-size="26" font-weight="550" fill="#171717">Still</text>
<text x="1380" y="44" text-anchor="end" font-size="22" fill="#626262">설명용 예시 대화</text>
<path d="M60 68H1380" stroke="#d5d5d5"/>
<text x="60" y="120" font-size="40" fill="#171717">앞선 추천을 다른 AI와 이어갑니다</text>
<g transform="translate(0 1.0)"><g class="bubble" data-role="user"><rect x="446.79999999999995" y="160" width="873.2" height="138" rx="28" fill="#e5e7e9"/><text x="478.79999999999995" y="214" font-size="34" fill="#171717">라떼로 마실 원두 추천해 줘. 고소하고 단맛 나는</text><text x="478.79999999999995" y="263" font-size="34" fill="#171717">게 좋아.</text></g><text x="128" y="334" font-size="24" fill="#626262">Still · Codex</text><g class="bubble" data-role="assistant"><rect x="120" y="348" width="1002.4" height="89" rx="28" fill="#ffffff"/><text x="152" y="402" font-size="34" fill="#171717">자뎅 에스프레소 블렌드와 모모스 에스쇼콜라를 추천해요.</text></g><path d="M120 489H1320" stroke="#c7cbd0"/><rect x="495.0" y="453" width="450" height="72" rx="22" fill="#e1e4e8"/><text x="720.0" y="483" text-anchor="middle" font-size="28" fill="#171717">Codex → Claude Code</text><text x="720.0" y="509" text-anchor="middle" font-size="22" fill="#626262">/ai claude-code</text><g class="bubble" data-role="user"><rect x="691.6" y="545" width="628.4" height="89" rx="28" fill="#e5e7e9"/><text x="723.6" y="599" font-size="34" fill="#171717">그럼 이번엔 두 번째 걸로 해볼래.</text></g><text x="128" y="670" font-size="24" fill="#626262">Still · Claude Code</text><g class="bubble" data-role="assistant"><rect x="120" y="684" width="1145.2" height="138" rx="28" fill="#ffffff"/><text x="152" y="738" font-size="34" fill="#171717">모모스 에스쇼콜라로 볼게요. 라떼에 넣었을 때도 고소하고 달콤한</text><text x="152" y="787" font-size="34" fill="#171717">맛이 나는지 이어서 확인해 볼게요.</text></g></g>
<text x="60" y="905" font-size="30" fill="#626262">사용 흐름 예시 · 실제 대화 원문 아님</text>
</g></svg>
