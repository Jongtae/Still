<title>在亚马逊继续调查之前找的 F1 模型</title><desc>在亚马逊继续调查之前找的 F1 模型 我对 F1 汽车模型感兴趣，在哪里可以订购？ 接着寻找同类模型 也帮我在亚马逊多找一些好吗？ 我在 Amazon US 找到了更多标有可配送至韩国的商品，都是 Bburago 1:43 模型。… 如果是第一台模型，我会推荐 McLaren MCL38。 最终金额需要在结账时确认。部分步骤未能核实。 真实对话 · 翻译、缩写 2026-10-11</desc>
