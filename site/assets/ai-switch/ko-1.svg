<text x="60" y="160" font-size="42" fill="#171717">기억한 취향으로 원두를 고릅니다</text>
<g transform="translate(0 13.5)"><rect x="180" y="213" width="770" height="249" rx="28" fill="#e5e7e9"/><text x="212" y="243" font-size="24" fill="#626262">나</text><text x="212" y="278" font-size="44" fill="#171717">어제 coffee coffee coffee에서</text><text x="212" y="341" font-size="44" fill="#171717">라떼를 마셨는데 메뉴 이름이</text><text x="212" y="404" font-size="44" fill="#171717">기억이 안나네.</text><rect x="50" y="478" width="900" height="249" rx="28" fill="#ffffff"/><text x="82" y="508" font-size="24" fill="#626262">Still</text><text x="82" y="543" font-size="44" fill="#171717">고소하고 달콤해서 다음에도 먹고</text><text x="82" y="606" font-size="44" fill="#171717">싶다고 하셨던 라떼예요. 다만 정확한</text><text x="82" y="669" font-size="44" fill="#171717">메뉴명까지 확인해 둔 건 아니에요.</text><rect x="180" y="743" width="770" height="186" rx="28" fill="#e5e7e9"/><text x="212" y="773" font-size="24" fill="#626262">나</text><text x="212" y="808" font-size="44" fill="#171717">집에서 먹는 원두 거의 다</text><text x="212" y="871" font-size="44" fill="#171717">떨어졌어</text><rect x="50" y="945" width="900" height="312" rx="28" fill="#ffffff"/><text x="82" y="975" font-size="24" fill="#626262">Still</text><text x="82" y="1010" font-size="44" fill="#171717">아까 좋아하셨던 커피커피커피</text><text x="82" y="1073" font-size="44" fill="#171717">라떼처럼 고소한 맛을 기준으로 찾아볼</text><text x="82" y="1136" font-size="44" fill="#171717">수 있어요. … 집에서는 커피머신으로</text><text x="82" y="1199" font-size="44" fill="#171717">내려 드세요, 핸드드립으로 드세요?</text></g>
