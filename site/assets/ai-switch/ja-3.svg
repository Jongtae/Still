<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" xml:lang="ja">
<title>別の AI で続けられます。</title><desc>Codex に切り替えたあと Spam を外して。 Spam Classic 200 g を1個カートから外し、再確認しました。ほかの22商品は残っています。現在は判断 AI が使えないため、既定の AI が依頼を直接処理します。 実際の会話を翻訳・要約した再構成画像</desc>
<rect width="1000" height="1040" rx="32" fill="#f0f1f3"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="50" y="65" font-size="28" fill="#626262">Still / 03</text>
<text x="50" y="145" font-size="58" font-weight="550" fill="#171717">別の AI で続けられます。</text>
<text x="50" y="210" font-size="32" fill="#626262">Codex に切り替えたあと</text>
<rect x="90" y="265" width="840" height="122" rx="28" fill="#e5e7e9"/><text x="120" y="300" font-size="24" fill="#171717">あなた</text><text x="120" y="350" font-size="36" fill="#171717">Spam を外して。</text><rect x="50" y="417" width="880" height="278" rx="28" fill="#ffffff"/><text x="80" y="452" font-size="24" fill="#171717">Still</text><text x="80" y="502" font-size="36" fill="#171717">Spam Classic 200 g を1個カートから外し、再</text><text x="80" y="554" font-size="36" fill="#171717">確認しました。ほかの22商品は残っています。</text><text x="80" y="606" font-size="36" fill="#171717">現在は判断 AI が使えないため、既定の AI が</text><text x="80" y="658" font-size="36" fill="#171717">依頼を直接処理します。</text>
<path d="M50 950H950" stroke="#d5d5d5"/>
<text x="50" y="990" font-size="27" fill="#626262">実際の会話を翻訳・要約した再構成画像</text>
</g></svg>
